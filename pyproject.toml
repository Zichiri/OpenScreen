[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openscreen-lan"
version = "0.1.0"
description = "Share a Windows or macOS screen with browsers on the same LAN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "mss>=10,<11",
    "Pillow>=10.4,<14",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1"]

[project.scripts]
openscreen = "openscreen.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openscreen = ["static/*.html", "static/*.css", "static/*.js"]
